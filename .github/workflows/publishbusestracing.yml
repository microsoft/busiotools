name: Publish Buses Tracing Tools (for winget)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump"
        type: choice
        required: true
        default: minor
        options:
          - major
          - minor
          - patch
      configuration:
        description: "Build configuration"
        type: choice
        required: true
        default: Release
        options:
          - Release
          - Debug

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

# All branches publish into the same release-tag namespace.
concurrency:
  group: publish-busestracing
  cancel-in-progress: false

jobs:
  # 1) Compute next version once. Tag happens in the release job.
  versioning:
    runs-on: windows-latest
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          $bump = $env:VERSION_BUMP
          if ($bump -notin @('major', 'minor', 'patch')) {
            throw "Invalid version bump: '$bump'."
          }

          $tags = git --no-pager tag --list 'bt*' --sort=-version:refname
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list release tags."
          }

          $latestTag = $tags |
            Where-Object { $_ -match '^bt[0-9]+\.[0-9]+\.[0-9]+$' } |
            Select-Object -First 1

          if ([string]::IsNullOrEmpty($latestTag)) {
            $nextVersion = '1.0.0'
            Write-Host "No existing release tags; starting at $nextVersion."
          } else {
            $parts = $latestTag.Substring(2).Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]

            switch ($bump) {
              'major' { $major += 1; $minor = 0; $patch = 0 }
              'minor' { $minor += 1; $patch = 0 }
              'patch' { $patch += 1 }
            }

            $nextVersion = "$major.$minor.$patch"
            Write-Host "Previous release tag: $latestTag"
          }

          Write-Host "Requested bump: $bump"
          Write-Host "Next release tag: bt$nextVersion"
          "next_version=$nextVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
  # 2) Build matrix for both win-x64 and win-arm64. Upload per-runtime zip artifact.
  build:
    needs: versioning
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      DOTNET_VERSION: '9.0.x'
      CONFIGURATION: ${{ inputs.configuration }}
      PROJECT_PATH: 'usb\tracingwrapper\BusesTraceWrapper.csproj'
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore "$env:PROJECT_PATH"
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }

      - name: Calculate BusesTrace.cmd SHA-256
        id: busestrace_hash
        run: |
          $hash = (Get-FileHash `
            -LiteralPath 'usb\tracing\BusesTrace.cmd' `
            -Algorithm SHA256 `
            -ErrorAction Stop).Hash

          "sha256=$hash" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish EXE (single-file, self-contained)
        env:
          BUSES_TRACE_SHA256: ${{ steps.busestrace_hash.outputs.sha256 }}
        run: |
          dotnet publish "$env:PROJECT_PATH" `
            -c "$env:CONFIGURATION" `
            -r "$env:RUNTIME" `
            /p:PublishSingleFile=true `
            /p:SelfContained=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            "/p:BusesTraceSha256=$env:BUSES_TRACE_SHA256" `
            --output "publish\$env:RUNTIME"

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed for $env:RUNTIME."
          }

      - name: Stage scripts + EXE for this runtime
        run: |
          $stage = "stage\$env:RUNTIME"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path 'usb\tracing\*' -Destination $stage -Recurse -Force
          Copy-Item -LiteralPath "publish\$env:RUNTIME\BusesTraceWrapper.exe" `
            -Destination $stage -Force

      - name: Create zip for this runtime
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $zipName = "busestracing-$env:RUNTIME.zip"
          Compress-Archive -Path "stage\$env:RUNTIME\*" `
            -DestinationPath "release\$zipName"
          Write-Host "Created release\$zipName"

      - name: Upload artifact (this runtime)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips-${{ matrix.runtime }}
          path: release\busestracing-${{ matrix.runtime }}.zip
          if-no-files-found: error
  # 3) Single release job: creates tag and publishes both zips in one release.
  release:
    needs: [versioning, build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release

      - name: Create new tag
        env:
          NEXT_VERSION: ${{ needs.versioning.outputs.next_version }}
        run: |
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch release tags."
          }

          $tag = "bt$env:NEXT_VERSION"
          $existing = git --no-pager tag --list $tag
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to check whether $tag already exists."
          }
          if ($existing) {
            throw "Tag $tag already exists; refusing to overwrite release assets."
          }

          git tag $tag "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create tag $tag."
          }

          git push origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push tag $tag; the release will not be published."
          }

          Write-Host "Created $tag at $env:GITHUB_SHA."

      - name: Create new GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT_VERSION: ${{ needs.versioning.outputs.next_version }}
        run: |
          $tag = "bt$env:NEXT_VERSION"
          gh release create $tag `
            'release\zips-win-x64\busestracing-win-x64.zip' `
            'release\zips-win-arm64\busestracing-win-arm64.zip' `
            --verify-tag `
            --title "Buses Tracing Tools (winget) v$env:NEXT_VERSION" `
            --notes "Buses Tracing Tools for Windows x64 and Arm64."

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release $tag; existing releases are not updated."
          }
